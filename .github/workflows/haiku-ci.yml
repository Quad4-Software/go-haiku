# Pinned: vmactions/haiku-vm@v1.1.3  0ba6b98c8d7e5626f9defdd7403af49ad72b51df
name: Haiku CI

on:
  push:
    branches:
      - golang-*-haiku
      - main
  pull_request:
    branches:
      - golang-*-haiku
      - main

concurrency:
  group: haiku-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAIKU_RELEASE: r1beta5
  # Seed bootstrap until this repo publishes its own releases.
  BOOTSTRAP_URL: https://github.com/korli/go/releases/download/go1.26.1-haiku1/go-1.26.1-haiku-amd64-bootstrap.tbz

jobs:
  haiku:
    name: Build and smoke (Haiku)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Build on Haiku
        uses: vmactions/haiku-vm@0ba6b98c8d7e5626f9defdd7403af49ad72b51df # v1.1.3
        with:
          release: ${{ env.HAIKU_RELEASE }}
          usesh: true
          copyback: false
          mem: 8192
          prepare: |
            set -eu
            pkgman install -y curl
            mkdir -p /boot/home/user/bootstrap
            curl -fsSL -o /tmp/go-bootstrap.tbz "${{ env.BOOTSTRAP_URL }}"
            tar -xjf /tmp/go-bootstrap.tbz -C /boot/home/user/bootstrap --strip-components=1
            test -x /boot/home/user/bootstrap/bin/go
            /boot/home/user/bootstrap/bin/go version
          run: |
            set -eu
            export GOROOT_BOOTSTRAP=/boot/home/user/bootstrap
            export GOCACHE=/boot/home/user/.cache/go-build
            export GOTMPDIR=/boot/home/user/tmp
            mkdir -p "$GOCACHE" "$GOTMPDIR"
            chmod +x haiku/scripts/*.sh
            ./haiku/scripts/haiku-build.sh
            ./haiku/scripts/haiku-smoke.sh
