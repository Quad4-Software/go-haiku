# Pinned: vmactions/haiku-vm@v1.1.3  0ba6b98c8d7e5626f9defdd7403af49ad72b51df
name: Haiku CI

on:
  push:
    branches:
      - golang-*-haiku
      - main
  pull_request:
    branches:
      - golang-*-haiku
      - main
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      bootstrap_url:
        description: Optional bootstrap URL override (must be allowlisted GitHub release)
        required: false
        default: ''
        type: string
      bootstrap_sha256:
        description: SHA-256 of bootstrap_url (required when URL is set)
        required: false
        default: ''
        type: string
      bootstrap_pin_tag:
        description: Prefer this repo release tag (must include SHA256SUMS asset)
        required: false
        default: ''
        type: string
      net_tests:
        description: Run loopback TCP/UDP smoke tests
        required: true
        default: true
        type: boolean
      qemu_386:
        description: Run QEMU Haiku x86 (386) runtime smoke
        required: true
        default: true
        type: boolean

concurrency:
  group: haiku-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAIKU_RELEASE: r1beta5

jobs:
  haiku:
    name: Build and smoke (Haiku amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      run_qemu_386: ${{ steps.boot.outputs.qemu_386 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Audit upstream CVEs
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/golang/go.git 2>/dev/null || git remote set-url upstream https://github.com/golang/go.git
          ver=$(sed -n '1p' VERSION | tr -d '\r')
          git fetch --depth=200 upstream release-branch.go1.26
          git fetch upstream "refs/tags/${ver}:refs/tags/${ver}" || true
          chmod +x haiku/scripts/*.sh
          ./haiku/scripts/audit-upstream-cves.sh upstream/release-branch.go1.26

      - name: Resolve bootstrap
        id: boot
        env:
          HAIKU_BOOTSTRAP_URL: ${{ inputs.bootstrap_url || '' }}
          HAIKU_BOOTSTRAP_SHA256: ${{ inputs.bootstrap_sha256 || '' }}
          HAIKU_BOOTSTRAP_PIN_TAG: ${{ inputs.bootstrap_pin_tag || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x haiku/scripts/*.sh
          resolved=$(./haiku/scripts/resolve-bootstrap-url.sh)
          url=${resolved%%$'\t'*}
          sha=${resolved#*$'\t'}
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Using bootstrap: $url"
          echo "SHA-256: $sha"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "net_tests=${{ inputs.net_tests }}" >> "$GITHUB_OUTPUT"
            echo "qemu_386=${{ inputs.qemu_386 }}" >> "$GITHUB_OUTPUT"
          else
            echo "net_tests=true" >> "$GITHUB_OUTPUT"
            echo "qemu_386=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build on Haiku (amd64 + cross 386)
        uses: vmactions/haiku-vm@0ba6b98c8d7e5626f9defdd7403af49ad72b51df # v1.1.3
        with:
          release: ${{ env.HAIKU_RELEASE }}
          usesh: true
          copyback: true
          mem: 8192
          cache-after-prepare: false
          prepare: |
            set -eu
            pkgman install -y curl openssl
            chmod +x haiku/scripts/*.sh
            export HAIKU_BOOTSTRAP_URL='${{ steps.boot.outputs.url }}'
            export HAIKU_BOOTSTRAP_SHA256='${{ steps.boot.outputs.sha256 }}'
            export GITHUB_REPOSITORY='${{ github.repository }}'
            ./haiku/scripts/fetch-bootstrap.sh /boot/home/user/bootstrap
          run: |
            set -eu
            export GOROOT_BOOTSTRAP=/boot/home/user/bootstrap
            export GOCACHE=/boot/home/user/.cache/go-build
            export GOTMPDIR=/boot/home/user/tmp
            mkdir -p "$GOCACHE" "$GOTMPDIR"
            chmod +x haiku/scripts/*.sh
            ./haiku/scripts/haiku-build.sh
            ./haiku/scripts/haiku-smoke.sh
            if [ "${{ steps.boot.outputs.net_tests }}" = "true" ]; then
              ./haiku/scripts/haiku-net-prep.sh || true
              ./haiku/scripts/haiku-net-smoke.sh
            fi
            ./haiku/scripts/haiku-cross-386.sh "$(pwd)/haiku/dist"
            ls -lh haiku/dist
            # Shrink copyback: keep only packaged bootstraps
            rm -rf bin pkg 2>/dev/null || true

      - name: Upload 386 bootstrap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: haiku-386-bootstrap
          path: |
            haiku/dist/go-*-haiku-386-bootstrap.tbz
            haiku/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  haiku-386-qemu:
    name: QEMU Haiku x86 (386) smoke
    needs: haiku
    if: needs.haiku.outputs.run_qemu_386 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Download 386 bootstrap
        uses: actions/download-artifact@v4
        with:
          name: haiku-386-bootstrap
          path: haiku/dist

      - name: Host deps for QEMU
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils curl openssh-client sshpass \
            tesseract-ocr
          python3 -m pip install -q --user vncdotool
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          chmod +x haiku/scripts/*.sh haiku/scripts/qemu_haiku_386.py
          ls -lh haiku/dist
          command -v vncdotool
          command -v qemu-system-i386 || command -v qemu-system-x86_64

      - name: Cache Haiku x86 qcow2
        uses: actions/cache@v4
        with:
          path: haiku/qemu-386
          key: haiku-r1beta5-x86-gcc2h-ssh-v1

      - name: QEMU 386 runtime smoke
        env:
          HAIKU_QEMU_WORK: haiku/qemu-386
          HAIKU_QEMU_VNC: 127.0.0.1:1
          HAIKU_QEMU_SSH_PORT: '2222'
          HAIKU_QEMU_MEM: '2048'
        run: |
          set -euo pipefail
          tbz=$(ls haiku/dist/go-*-haiku-386-bootstrap.tbz | head -n 1)
          ./haiku/scripts/qemu-haiku-386-smoke.sh all "$tbz"
