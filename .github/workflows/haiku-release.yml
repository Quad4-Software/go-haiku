# Pinned: vmactions/haiku-vm@v1.1.3  0ba6b98c8d7e5626f9defdd7403af49ad72b51df
name: Haiku Release

on:
  push:
    tags:
      - 'go*-haiku.*'
  workflow_dispatch:
    inputs:
      go_version:
        description: Go version without go prefix (e.g. 1.26.5)
        required: true
        type: string
      haiku_revision:
        description: Haiku packaging revision (tag becomes goVERSION-haiku.N)
        required: true
        default: '1'
        type: string
      ref:
        description: Git ref to build (branch, tag, or SHA). Empty uses the workflow ref.
        required: false
        default: ''
        type: string
      bootstrap_url:
        description: Bootstrap tarball URL (allowlisted GitHub release only)
        required: false
        default: ''
        type: string
      bootstrap_sha256:
        description: SHA-256 of bootstrap_url (required when URL is set)
        required: false
        default: ''
        type: string
      bootstrap_pin_tag:
        description: Prefer this repo release tag with SHA256SUMS
        required: false
        default: ''
        type: string
      run_tests:
        description: Run Haiku smoke tests before packaging
        required: true
        default: true
        type: boolean
      publish_tag:
        description: Create and push tag goVERSION-haiku.N when using workflow_dispatch
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  HAIKU_RELEASE: r1beta5

jobs:
  release:
    name: Build bootstrap (${{ inputs.go_version || github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Resolve versions
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GO_VERSION="${{ inputs.go_version }}"
            HAIKU_REV="${{ inputs.haiku_revision }}"
            REF="${{ inputs.ref }}"
            if [ -z "$REF" ]; then
              REF="${{ github.ref_name }}"
            fi
            TAG="go${GO_VERSION}-haiku.${HAIKU_REV}"
            BOOTSTRAP_URL="${{ inputs.bootstrap_url }}"
            BOOTSTRAP_SHA256="${{ inputs.bootstrap_sha256 }}"
            BOOTSTRAP_PIN_TAG="${{ inputs.bootstrap_pin_tag }}"
            RUN_TESTS="${{ inputs.run_tests }}"
            PUBLISH_TAG="${{ inputs.publish_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "$TAG" =~ ^go([0-9]+\.[0-9]+\.[0-9]+)-haiku\.([0-9]+)$ ]]; then
              echo "Tag must match goX.Y.Z-haiku.N (got $TAG)" >&2
              exit 1
            fi
            GO_VERSION="${BASH_REMATCH[1]}"
            HAIKU_REV="${BASH_REMATCH[2]}"
            REF="$TAG"
            BOOTSTRAP_URL=""
            BOOTSTRAP_SHA256=""
            BOOTSTRAP_PIN_TAG=""
            RUN_TESTS=true
            PUBLISH_TAG=false
          fi
          {
            echo "go_version=$GO_VERSION"
            echo "haiku_rev=$HAIKU_REV"
            echo "tag=$TAG"
            echo "ref=$REF"
            echo "bootstrap_url_override=$BOOTSTRAP_URL"
            echo "bootstrap_sha256_override=$BOOTSTRAP_SHA256"
            echo "bootstrap_pin_tag=$BOOTSTRAP_PIN_TAG"
            echo "run_tests=$RUN_TESTS"
            echo "publish_tag=$PUBLISH_TAG"
            echo "asset_amd64=go-${GO_VERSION}-haiku-amd64-bootstrap.tbz"
            echo "asset_386=go-${GO_VERSION}-haiku-386-bootstrap.tbz"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.meta.outputs.ref }}

      - name: Resolve bootstrap
        id: boot
        env:
          HAIKU_BOOTSTRAP_URL: ${{ steps.meta.outputs.bootstrap_url_override }}
          HAIKU_BOOTSTRAP_SHA256: ${{ steps.meta.outputs.bootstrap_sha256_override }}
          HAIKU_BOOTSTRAP_PIN_TAG: ${{ steps.meta.outputs.bootstrap_pin_tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          chmod +x haiku/scripts/*.sh
          resolved=$(./haiku/scripts/resolve-bootstrap-url.sh)
          url=${resolved%%$'\t'*}
          sha=${resolved#*$'\t'}
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "Using bootstrap: $url"
          echo "SHA-256: $sha"

      - name: Ensure VERSION matches release
        shell: bash
        run: |
          set -euo pipefail
          want="go${{ steps.meta.outputs.go_version }}"
          have=$(sed -n '1p' VERSION | tr -d '\r')
          if [ "$have" != "$want" ]; then
            printf '%s\ntime %s\n' "$want" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > VERSION
            echo "Updated VERSION to $want"
          fi
          cat VERSION

      - name: Build and package on Haiku
        uses: vmactions/haiku-vm@0ba6b98c8d7e5626f9defdd7403af49ad72b51df # v1.1.3
        with:
          release: ${{ env.HAIKU_RELEASE }}
          usesh: true
          copyback: true
          mem: 8192
          cache-after-prepare: false
          prepare: |
            set -eu
            pkgman install -y curl openssl
            chmod +x haiku/scripts/*.sh
            export HAIKU_BOOTSTRAP_URL='${{ steps.boot.outputs.url }}'
            export HAIKU_BOOTSTRAP_SHA256='${{ steps.boot.outputs.sha256 }}'
            export GITHUB_REPOSITORY='${{ github.repository }}'
            ./haiku/scripts/fetch-bootstrap.sh /boot/home/user/bootstrap
          run: |
            set -eu
            export GOROOT_BOOTSTRAP=/boot/home/user/bootstrap
            export GOCACHE=/boot/home/user/.cache/go-build
            export GOTMPDIR=/boot/home/user/tmp
            mkdir -p "$GOCACHE" "$GOTMPDIR"
            chmod +x haiku/scripts/*.sh
            ./haiku/scripts/haiku-build.sh
            if [ "${{ steps.meta.outputs.run_tests }}" = "true" ]; then
              ./haiku/scripts/haiku-smoke.sh
              ./haiku/scripts/haiku-net-prep.sh || true
              ./haiku/scripts/haiku-net-smoke.sh
            fi
            ./haiku/scripts/package-bootstrap.sh "$(pwd)/haiku/dist" amd64
            ./haiku/scripts/haiku-cross-386.sh "$(pwd)/haiku/dist"
            ls -lh haiku/dist
            rm -rf bin pkg 2>/dev/null || true

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch' && steps.meta.outputs.publish_tag == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet VERSION; then
            git add VERSION
            git commit -m "release: ${TAG}"
            git push origin HEAD
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/${TAG}"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          ASSET64="haiku/dist/${{ steps.meta.outputs.asset_amd64 }}"
          ASSET32="haiku/dist/${{ steps.meta.outputs.asset_386 }}"
          SUMS="haiku/dist/SHA256SUMS"
          test -f "$ASSET64"
          test -f "$ASSET32"
          test -f "$SUMS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET64" "$ASSET32" "$SUMS" --clobber
          else
            gh release create "$TAG" "$ASSET64" "$ASSET32" "$SUMS" \
              --title "$TAG" \
              --generate-notes
          fi
          echo "Published $TAG"
          cat "$SUMS"
